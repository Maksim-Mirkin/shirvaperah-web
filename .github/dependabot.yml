version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Major upgrades are planned and tested as focused maintenance features.
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      production-patches:
        applies-to: version-updates
        dependency-type: production
        patterns:
          - "*"
        update-types:
          - patch
      development-updates:
        applies-to: version-updates
        dependency-type: development
        patterns:
          - "*"
        update-types:
          - minor
          - patch
