version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      production-patches:
        applies-to: version-updates
        dependency-type: production
        patterns:
          - "*"
        update-types:
          - patch
      development-patches:
        applies-to: version-updates
        dependency-type: development
        patterns:
          - "*"
        update-types:
          - patch
